name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Generated templates are up to date
        run: |
          go tool templ generate
          git diff --exit-code -- '*_templ.go'
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
