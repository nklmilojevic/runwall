apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: runwall
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword # your cluster's secret store (1Password, Vault, …)
  target:
    name: runwall
  data:
    - secretKey: GITHUB_APP_ID
      remoteRef: { key: GitHub Actions Dashboard App, property: app_id }
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef: { key: GitHub Actions Dashboard App, property: private_key }
    - secretKey: GITHUB_WEBHOOK_SECRET
      remoteRef: { key: GitHub Actions Dashboard App, property: webhook_secret }
    - secretKey: GITHUB_CLIENT_ID
      remoteRef: { key: GitHub Actions Dashboard App, property: client_id }
    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef: { key: GitHub Actions Dashboard App, property: client_secret }
    - secretKey: SESSION_KEY
      remoteRef: { key: GitHub Actions Dashboard App, property: session_key }
